# Mirrors gufe's own .pre-commit-config.yaml so contributors moving between the
# two repos meet the same rules.
ci:
  autoupdate_schedule: "quarterly"
  autofix_prs: false

exclude: |
  (?x)^(
    python/alchemy_viz/_assets/alchemy-viz\.js|
    ts/src/schema/types\.ts|
    package-lock\.json|
    pixi\.lock
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The committed bundle is exempt above; nothing else should be big.
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: debug-statements
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: '\.(graphml)$'
      - id: trailing-whitespace
        exclude: '\.(pdb|gro|top|sdf|xml|cif|graphml)$'

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.25.1"
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # The demo notebook's outputs are an `<iframe srcdoc>` holding a whole
        # page each - a quarter of a megabyte per view, none of which GitHub
        # will render. Strip them.
        #
        # The gallery notebook is excluded because its outputs are the entire
        # point of the file: they are the screenshots that make the views
        # visible on GitHub, and `pixi run gallery` is what puts them there.
        # Stripping it would silently delete what it exists to carry.
        exclude: ^examples/notebooks/alchemy-viz-gallery\.ipynb$
