name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything runs through `pixi run <task>`, so CI and a developer's laptop
  # execute literally the same commands.
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs the tags

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - run: pixi run lint
      - run: pixi run test-py
      - run: pixi run test-ts

  # One job, one purpose: prove the four committed generated artifacts match a
  # fresh build. Split out so a failure here is unambiguous. The schema is not
  # among them - it is hand-written, so there is nothing to regenerate.
  generated:
    name: generated artifacts are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - run: pixi run check-generated

  # The state a `pip install alchemy-viz` actually lands in: no Node toolchain,
  # and no gufe. gufe is not installable from PyPI at a usable version, so it is
  # declared as an extra rather than a hard dependency, which makes "installed,
  # importable, and rendering payloads, with no gufe present" the ordinary case
  # this job has to hold. The plain `pip install .` here - no `--no-deps` - is
  # the assertion that resolution succeeds on PyPI alone.
  pip-install:
    name: pip install (no node, no gufe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      - name: gufe really is absent
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          if importlib.util.find_spec("gufe") is not None:
              sys.exit("gufe got installed; the extra is leaking into the hard dependencies")
          print("no gufe, as expected")
          PY

      # The bundle is committed and ships inside the wheel rather than beside
      # it, which is what makes the no-Node install above possible. Run from a
      # temp directory so this reads the installed package, not the checkout.
      - name: the bundle shipped with the wheel
        run: python -c "import alchemy_viz; print(alchemy_viz.bundle_source()[:80])"
        working-directory: ${{ runner.temp }}

      - name: rendering a payload needs no gufe
        run: |
          python - <<'PY'
          import alchemy_viz

          html = alchemy_viz.to_html({"type": "SmallMoleculeComponentViz", "name": "x"})
          assert "<alchemy-view" in html, html[:200]
          print(f"rendered {len(html):,} bytes")
          PY
        working-directory: ${{ runner.temp }}

      # The other half of the same decision. Dropping the hard requirement must
      # not turn "gufe is missing" into a bare ModuleNotFoundError naming a
      # package the reader cannot pip-install; it has to name conda-forge.
      - name: a missing gufe is reported in words
        run: |
          python - <<'PY'
          import alchemy_viz

          try:
              alchemy_viz.payload_for(object())
          except ImportError as e:
              assert "conda-forge" in str(e), f"no install instruction in: {e}"
              print("reported as:", str(e).splitlines()[0])
          else:
              raise SystemExit("expected ImportError when gufe is not installed")
          PY
        working-directory: ${{ runner.temp }}
